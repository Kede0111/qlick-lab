# Qlick Lab — the Xcode project, described for XcodeGen (https://github.com/yonaskolb/XcodeGen), as QLab's is.
# `QlickLab.xcodeproj` is committed so it opens directly; after adding or removing files: `xcodegen generate`.
#
# The same sources also build without Xcode: `swift build --package-path macos`, and
# `scripts/build_app.sh` makes the app from that.
name: QlickLab
options:
  bundleIdPrefix: be.jackfrom
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEAD_CODE_STRIPPING: "YES"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  QlickLab:
    type: application
    platform: macOS
    sources:
      - path: macos/Sources/QlickLab
      - path: macos/Assets.xcassets
      # The app icon, in Icon Composer's format: macOS 26 and later shape it themselves.
      - path: macos/AppIcon.icon
        buildPhase: resources
      # Folder references: copied whole into Resources, as the app expects them (`data`, `Fonts`).
      - path: data
        type: folder
      - path: macos/Fonts
        type: folder
      - path: assets/qlick-lab.icns
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: Sparkle
    preBuildScripts:
      - name: Build the Rust engine
        script: bash "$SRCROOT/scripts/xcode_rust.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: Qlick Lab
        PRODUCT_MODULE_NAME: QlickLab
        PRODUCT_BUNDLE_IDENTIFIER: be.jackfrom.qlicklab
        INFOPLIST_FILE: macos/QlickLab-Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: "NO"
        ENABLE_APP_SANDBOX: "NO"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_STRICT_CONCURRENCY: minimal
  QlickLabTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: macos/Tests/QlickLabTests
    dependencies:
      - target: QlickLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.jackfrom.qlicklab.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Qlick Lab.app/Contents/MacOS/Qlick Lab"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
schemes:
  QlickLab:
    build:
      targets:
        QlickLab: all
        QlickLabTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QlickLabTests
    archive:
      config: Release
